[project]
name = "pharma-agent"
version = "0.1.0"
description = "Agentic research assistant over FDA drug labels (Syntax Systems GenAI assignment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "langgraph>=1.2.20",
    "numpy>=2.4.6",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
